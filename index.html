<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Home Dark Mode (No Green)</title>
    
    <!-- Стили Lichess Chessground -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Премиальная угольно-темная палитра */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #161512; /* Фирменный глубокий черный Lichess */
            color: #bababa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            background-color: #21201d; /* Темно-серый блок управления */
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            gap: 30px;
            border: 1px solid #2d2b27;
        }

        /* Ограничиваем размер доски */
        .board-wrapper {
            width: 520px;
            height: 520px;
        }

        /* Элегантная текстура темного дерева без зелени */
        .cg-wrap {
            width: 100%;
            height: 100%;
            background-image: url('https://lichess1.org');
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
        }

        /* Кастомизация Chessground: меняем цвет кружков и стрелок ходов на синий/голубой вместо зеленого */
        .cg-wrap cg-board square.move-dest {
            background: radial-gradient(rgba(52, 152, 219, 0.4) 18%, transparent 0);
        }
        .cg-wrap cg-board square.occulated {
            background: radial-gradient(transparent 70%, rgba(52, 152, 219, 0.4) 0);
        }
        .cg-wrap cg-board square.last-move {
            background-color: rgba(52, 152, 219, 0.25) !important;
        }

        /* Правая панель */
        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 20px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .status-box {
            background-color: #1a1917;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            color: #e3e3e3;
            border-left: 4px solid #3498db; /* Синий индикатор вместо зеленого */
            margin-bottom: 15px;
        }

        /* Монитор истории ходов */
        .moves-box {
            background-color: #1a1917;
            padding: 12px;
            border-radius: 8px;
            height: 140px;
            overflow-y: auto;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            color: #9c9c9c;
            border: 1px solid #2d2b27;
        }

        .moves-box div {
            padding: 2px 0;
            border-bottom: 1px solid #22211e;
        }

        /* Кнопки в строгой сине-серой гамме */
        .btn {
            background-color: #2980b9; /* Насыщенный синий */
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: #3498db;
        }

        .btn-secondary {
            background-color: #2d2b27;
            color: #bababa;
            border: 1px solid #3d3a35;
        }
        
        .btn-secondary:hover {
            background-color: #383530;
            color: #ffffff;
        }

        #best-move {
            color: #f1c40f; /* Золотой акцент для лучшего хода */
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Доска в стиле Темного Дерева -->
    <div class="board-wrapper">
        <div id="chess-board" class="cg-wrap cburnett"></div>
    </div>

    <!-- Интерфейс без зелени -->
    <div class="sidebar">
        <div>
            <h2>CHESS DARK HOME</h2>
            <div class="status-box">
                <div id="status">Ход белых. Удачи!</div>
                <div id="best-move"></div>
            </div>
            
            <div style="font-size: 11px; color: #6e6d6a; margin-bottom: 6px; letter-spacing: 0.5px;">ЛОГ ХОДОВ:</div>
            <div class="moves-box" id="moves-list"></div>
        </div>

        <div style="display: flex; flex-direction: column; margin-top: 15px;">
            <button class="btn" onclick="analyzePosition()">🔵 Подсказка Stockfish</button>
            <button class="btn btn-secondary" onclick="resetGame()">🔄 Сбросить</button>
        </div>
    </div>
</div>

<!-- Шахматные звуки Lichess -->
<audio id="sound-move" src="https://lichess1.org" preload="auto"></audio>
<audio id="sound-capture" src="https://lichess1.org" preload="auto"></audio>

<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>

<script>
    let game = new Chess();
    let board = null;

    function getValidMoves() {
        const moves = {};
        game.SQUARES.forEach(square => {
            const ms = game.moves({ square: square, verbose: true });
            if (ms.length > 0) {
                moves[square] = ms.map(m => m.to);
            }
        });
        return moves;
    }

    function onMove(from, to) {
        const pieceOnDest = game.get(to);
        const moveResult = game.move({ from: from, to: to, promotion: 'q' });
        
        if (moveResult) {
            if (pieceOnDest || moveResult.flags.includes('e')) {
                document.getElementById('sound-capture').play().catch(()=>{});
            } else {
                document.getElementById('sound-move').play().catch(()=>{});
            }
            updateStatus();
            updateMovesList();
        }
        
        board.set({
            turnColor: game.turn() === 'w' ? 'white' : 'black',
            movable: { dests: getValidMoves() }
        });
    }

    function updateStatus() {
        let statusText = "";
        document.getElementById('best-move').innerText = "";

        if (game.in_checkmate()) {
            statusText = `Мат. Конец игры.`;
        } else if (game.in_draw()) {
            statusText = "Ничья!";
        } else {
            statusText = `Ход ${game.turn() === 'w' ? 'Белых' : 'Черных'}.`;
            if (game.in_check()) statusText += " (Шах)";
        }
        document.getElementById('status').innerText = statusText;
    }

    function updateMovesList() {
        const history = game.history();
        const listElement = document.getElementById('moves-list');
        let rowHTML = '';
        for (let i = 0; i < history.length; i += 2) {
            const moveNumber = Math.floor(i / 2) + 1;
            const whiteMove = history[i];
            const blackMove = history[i+1] ? history[i+1] : '';
            rowHTML += `<div>${moveNumber}. ${whiteMove} &nbsp;&nbsp; ${blackMove}</div>`;
        }
        listElement.innerHTML = rowHTML;
        listElement.scrollTop = listElement.scrollHeight;
    }

    async function analyzePosition() {
        const fen = game.fen();
        document.getElementById('best-move').innerText = "Движок думает...";
        
        try {
            const response = await fetch(`https://lichess.org{encodeURIComponent(fen)}`);
            const data = await response.json();
            
            if (data.pvs && data.pvs) {
                const bestMove = data.pvs.moves.split(' ');
                document.getElementById('best-move').innerText = `💡 ИИ советует: ${bestMove.toUpperCase()}`;
            } else {
                document.getElementById('best-move').innerText = "Позиция не найдена в Cloud-базе.";
            }
        } catch (error) {
            document.getElementById('best-move').innerText = "Ошибка ИИ-сервера.";
        }
    }

    function resetGame() {
        game.reset();
        document.getElementById('best-move').innerText = "";
        document.getElementById('moves-list').innerHTML = "";
        
        const config = {
            orientation: 'white',
            turnColor: 'white',
            animation: { enabled: true, duration: 200 },
            movable: {
                color: 'white',
                free: false,
                dests: getValidMoves()
            },
            events: {
                after: onMove
            }
        };

        if (!board) {
            board = Chessground(document.getElementById('chess-board'), config);
        } else {
            board.set(config);
        }
        updateStatus();
